// Android build of Banjo: Recompiled for the AYN Thor.
//
// The native side is the same CMake project as the desktop version (../../CMakeLists.txt).
// Everything it needs that isn't in the repo is passed in through environment variables,
// which android/build_android.sh sets up:
//
//   BANJO_SDL2_PREFIX      SDL2 built for Android (lib/libSDL2.so, lib/cmake/SDL2)
//   BANJO_SDL2_SOURCE      SDL2 source tree, for SDL's Java classes
//   BANJO_FREETYPE_PREFIX  FreeType built for Android
//   BANJO_HOST_FILE_TO_C   RT64's file_to_c tool built for the build machine

plugins {
    id 'com.android.application'
}

static String requireEnv(String name) {
    String value = System.getenv(name)
    if (value == null || value.isEmpty()) {
        throw new GradleException("${name} is not set. Run android/build_android.sh, or see its comments for what to set.")
    }
    return value
}

final String repoRoot = rootProject.projectDir.parentFile.absolutePath
final String sdl2Prefix = requireEnv('BANJO_SDL2_PREFIX')
final String sdl2Source = requireEnv('BANJO_SDL2_SOURCE')
final String freetypePrefix = requireEnv('BANJO_FREETYPE_PREFIX')
final String hostFileToC = requireEnv('BANJO_HOST_FILE_TO_C')
final File generatedJniLibs = layout.buildDirectory.dir('generated/thor/jniLibs').get().asFile
final File generatedAssets = layout.buildDirectory.dir('generated/thor/assets').get().asFile

final String keystorePath = System.getenv('BANJO_KEYSTORE') ?: "${rootProject.projectDir}/debug.keystore"
final String keystorePassword = System.getenv('BANJO_KEYSTORE_PASSWORD') ?: 'android'
final String keyAliasName = System.getenv('BANJO_KEY_ALIAS') ?: 'androiddebugkey'
final String keyPasswordValue = System.getenv('BANJO_KEY_PASSWORD') ?: keystorePassword

android {
    namespace 'io.github.hydriostatic.banjothor'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.hydriostatic.banjothor'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('BANJO_VERSION_CODE') ?: '1').toInteger())
        versionName System.getenv('BANJO_VERSION_NAME') ?: '0.1.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                targets 'BanjoRecompiled'
                arguments '-DANDROID_STL=c++_static',
                        "-DSDL2_DIR=${sdl2Prefix}/lib/cmake/SDL2",
                        "-DCMAKE_PREFIX_PATH=${sdl2Prefix};${freetypePrefix}",
                        "-DCMAKE_FIND_ROOT_PATH=${sdl2Prefix};${freetypePrefix}",
                        "-DFREETYPE_LIBRARY=${freetypePrefix}/lib/libfreetype.a",
                        "-DFREETYPE_INCLUDE_DIRS=${freetypePrefix}/include/freetype2",
                        "-DFREETYPE_INCLUDE_DIR_ft2build=${freetypePrefix}/include/freetype2",
                        "-DFREETYPE_INCLUDE_DIR_freetype2=${freetypePrefix}/include/freetype2",
                        "-DRT64_HOST_FILE_TO_C=${hostFileToC}",
                        '-DZSTD_BUILD_PROGRAMS=OFF',
                        '-DZSTD_BUILD_TESTS=OFF',
                        '-DZSTD_BUILD_DICTBUILDER=OFF'
            }
        }
    }

    signingConfigs {
        thor {
            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.thor
        }
        debug {
            signingConfig signingConfigs.thor
        }
    }

    externalNativeBuild {
        cmake {
            path file("${repoRoot}/CMakeLists.txt")
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdl2Source}/android-project/app/src/main/java"
            jniLibs.srcDirs = [generatedJniLibs]
            assets.srcDirs = [generatedAssets]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// SDL2 is linked as a shared library, so it has to be packed next to libmain.so.
tasks.register('copySdlLibrary', Copy) {
    from "${sdl2Prefix}/lib/libSDL2.so"
    into "${generatedJniLibs}/arm64-v8a"
}

// The game reads its UI files, fonts and controller database from disk. They're packed
// under assets/program and unpacked on first launch (see ThorActivity).
tasks.register('copyProgramAssets', Copy) {
    into "${generatedAssets}/program"
    from("${repoRoot}/assets") {
        into 'assets'
    }
    from("${repoRoot}/recompcontrollerdb.txt")
}

preBuild.dependsOn 'copySdlLibrary', 'copyProgramAssets'
