name: validate-internal
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    # Desktop builds need upstream's private inputs, so they only run in the upstream repo.
    if: github.repository == 'BanjoRecomp/BanjoRecomp' && (github.event_name == 'push' || github.repository == github.event.pull_request.head.repo.full_name)
    uses: ./.github/workflows/validate.yml
    secrets: inherit
