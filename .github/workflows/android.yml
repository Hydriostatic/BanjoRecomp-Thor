name: android

# Compiles the Android port without a ROM, to catch build errors early. The APK itself is built
# in your private repository that holds the ROM (see android/README.md and
# android/ci/private-build.yml), so the ROM never has to be in this public repository.

on:
  push:
    branches:
      - main
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the port for Android without a ROM, so it runs even before the ROM is set up.
  check:
    name: Compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld llvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Compile
        env:
          BANJO_CHECK_ONLY: '1'
        run: |
          set -o pipefail
          bash android/build_android.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report errors
        if: failure()
        run: python3 android/ci/annotate_log.py "$RUNNER_TEMP/build.log"
